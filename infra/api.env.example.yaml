DEV_MODE: '0'
STORE_BACKEND: firestore
AI_BACKEND: vertex
GOOGLE_BACKEND: google
GCP_PROJECT: REPLACE_PROJECT
GCP_REGION: us-central1
# Model endpoint, independent of Cloud Run/Firestore location.
VERTEX_LOCATION: global
# Exact supported Vertex IDs must be selected in this project, then smoke-tested.
MODEL_FAST: REPLACE_FLASH_MODEL_ID
MODEL_PRO: REPLACE_PRO_MODEL_ID
MODEL_TIMEOUT_MS: '60000'
# Optional existing Google Meet link. Configure and verify the recording rig separately.
# MEET_URL: https://meet.google.com/abc-defg-hij
SERVICE_URL: https://REPLACE_API_URL
PUBLIC_ORIGIN: https://REPLACE_HOSTING_ORIGIN
CORS_ORIGINS: https://REPLACE_HOSTING_ORIGIN
A2A_HMAC_SECRET_NAME: projects/REPLACE_PROJECT/secrets/alter-a2a/versions/latest
GOOGLE_OAUTH_SECRET_NAME: projects/REPLACE_PROJECT/secrets/alter-demo-oauth/versions/latest
DIRECTOR_KEY_SECRET_NAME: projects/REPLACE_PROJECT/secrets/alter-director/versions/latest
GOOGLE_TEMPLATE_IDS: '{}'
ADMIN_EMAIL: REPLACE_VERIFIED_ADMIN_EMAIL
SCHEDULER_AUDIENCE: https://REPLACE_API_URL
SCHEDULER_SERVICE_ACCOUNT: alter-scheduler@REPLACE_PROJECT.iam.gserviceaccount.com
TRUST_FORWARDED_IP: '0'

# Restart-safe meeting workflows. deploy-api.sh fills these defaults automatically.
WORKFLOW_QUEUE: alter-workflows
WORKFLOW_SERVICE_ACCOUNT: alter-api@REPLACE_PROJECT.iam.gserviceaccount.com
# Optional native-audio Vertex model; select and validate one in the actual project.
# LIVE_MODEL: exact-supported-native-audio-model
# LIVE_LOCATION: supported-vertex-live-location
# Optional Search serving config; leave unset for explicitly identified lexical retrieval.
# SEARCH_SERVING_CONFIG: projects/PROJECT/locations/global/collections/default_collection/engines/ENGINE/servingConfigs/default_search
